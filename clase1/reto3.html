<!-- Una imagen de avatar (puede ser cualquier URL de placeholder, ej. https://i.pravatar.cc/150) con texto alternativo. -->
<!-- El nombre de la persona como título principal de la tarjeta. -->
<!-- El cargo debajo del nombre, en texto destacado pero secundario. -->
<!-- Una biografía corta de 2 párrafos. -->
<!-- Una lista no ordenada de habilidades (al menos 3). -->
<!-- Un enlace al portafolio que abra en una pestaña nueva. -->
<!-- Un correo de contacto que, al hacer clic, abra el cliente de correo. -->
<!DOCTYPE html>
<html lang="es">
    <body>
        <article class="carta-">
            <figure class="avatarpersona">
                <img src="https://i.pravatar.cc/150" alt="Avatar de la persona">
            </figure>

    <h1 class="nombre">Pepito</h1>
    <p class = "cargo">Sacristán</p>

    <section class="biografia">
        <p>Soy Pepito y llevo 50 años siendo el sacristán de mi parroquia.</p>
        <p>Me gusta mucho ser sacristán.</p>
    </section>

    <ul class="habilidades">
        <li>Conocedor de la liturgia</li>
        <li>Organización de eventos religiosos</li>
        <li>Cuidado de objetos sagrados</li>
    </ul>

    <a href="https://example.com/portfolio" target="_blank">Ver Portafolio</a>
    <a href="mailto:contacto@example.com">Contactar por correo</a>
</article>
</body>
